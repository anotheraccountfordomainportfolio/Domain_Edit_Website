<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer Neon Glow Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="30%" stop-color="#e879f9" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Metallic Silver for "D", Film Reel & Clapper -->
    <linearGradient id="metallicSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f1f5f9" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Vibrant Gradient for "E" & Film Strip -->
    <linearGradient id="gradientE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="20%" stop-color="#c084fc" />
      <stop offset="55%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="filmStripGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Base Badge Background -->
  <circle cx="256" cy="256" r="248" fill="#09090b" />
  
  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#neonBorder)" stroke-width="12" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="232" fill="#111115" />

  <!-- Clapperboard (Top Center/Right) -->
  <g transform="translate(220, 95) rotate(-8)" filter="url(#shadow)">
    <!-- Base Board -->
    <rect x="0" y="32" width="160" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <!-- Top Clapper Stick (Open) -->
    <g transform="translate(0, 0) rotate(-16)">
      <rect x="0" y="0" width="160" height="26" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
      <!-- Stripes -->
      <path d="M 25,0 L 45,0 L 25,26 L 5,26 Z" fill="#ffffff" />
      <path d="M 65,0 L 85,0 L 65,26 L 45,26 Z" fill="#ffffff" />
      <path d="M 105,0 L 125,0 L 105,26 L 85,26 Z" fill="#ffffff" />
      <path d="M 145,0 L 155,0 L 145,26 L 125,26 Z" fill="#ffffff" />
    </g>
    <!-- Base Stripes -->
    <path d="M 25,32 L 45,32 L 25,74 L 5,74 Z" fill="#ffffff" />
    <path d="M 65,32 L 85,32 L 65,74 L 45,74 Z" fill="#ffffff" />
    <path d="M 105,32 L 125,32 L 105,74 L 85,74 Z" fill="#ffffff" />
    <path d="M 145,32 L 155,32 L 145,74 L 125,74 Z" fill="#ffffff" />
    <!-- Hinge Screws -->
    <circle cx="16" cy="22" r="4" fill="#cbd5e1" />
    <circle cx="36" cy="26" r="4" fill="#cbd5e1" />
  </g>

  <!-- Letter 'D' (Metallic Silver) -->
  <g filter="url(#shadow)">
    <!-- D Path with top serif cutout -->
    <path d="M 88,160 L 105,160 C 105,160 115,180 150,180 L 200,180 C 240,180 275,205 275,255 C 275,305 240,330 200,330 L 150,330 L 150,300 L 195,300 C 220,300 238,285 238,255 C 238,225 220,210 195,210 L 150,210 L 150,330 L 110,330 L 110,180 L 88,160 Z" fill="url(#metallicSilver)" />
  </g>

  <!-- Letter 'E' (Purple to Blue Gradient) -->
  <g filter="url(#shadow)">
    <path d="M 275,180 L 420,180 C 400,215 370,225 295,225 L 295,250 L 380,250 L 380,280 L 295,280 L 295,310 C 350,310 400,310 425,335 C 435,345 432,370 410,380 C 370,398 310,390 275,360 Z" fill="url(#gradientE)" />
  </g>

  <!-- Film Reel (Bottom Left) -->
  <g transform="translate(130, 350)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="50" fill="url(#metallicSilver)" />
    <circle cx="0" cy="0" r="44" fill="#1e293b" />
    <circle cx="0" cy="0" r="14" fill="url(#metallicSilver)" />
    <circle cx="0" cy="0" r="6" fill="#0f172a" />
    <!-- Holes -->
    <circle cx="0" cy="-28" r="10" fill="#0f172a" />
    <circle cx="26" cy="-8" r="10" fill="#0f172a" />
    <circle cx="16" cy="23" r="10" fill="#0f172a" />
    <circle cx="-16" cy="23" r="10" fill="#0f172a" />
    <circle cx="-26" cy="-8" r="10" fill="#0f172a" />
  </g>

  <!-- Wavy Film Strip (Bottom Center/Right) -->
  <g filter="url(#shadow)">
    <!-- Main Strip -->
    <path d="M 130,400 Q 230,420 310,390 T 430,350 Q 420,380 370,410 T 170,418 Z" fill="url(#filmStripGrad)" />
    <!-- Film Frame Cutouts -->
    <rect x="210" y="402" width="16" height="12" rx="2" fill="#09090b" transform="rotate(10, 210, 402)" />
    <rect x="245" y="403" width="16" height="12" rx="2" fill="#09090b" transform="rotate(5, 245, 403)" />
    <rect x="280" y="398" width="16" height="12" rx="2" fill="#09090b" transform="rotate(-5, 280, 398)" />
    <rect x="315" y="388" width="16" height="12" rx="2" fill="#09090b" transform="rotate(-15, 315, 388)" />
    <rect x="350" y="372" width="16" height="12" rx="2" fill="#09090b" transform="rotate(-25, 350, 372)" />
  </g>

  <!-- Play Button Triangle inside bottom-right loop -->
  <g transform="translate(372, 352)" filter="url(#shadow)">
    <polygon points="0,-16 26,0 0,16" fill="#ffffff" />
  </g>
</svg>
